name: Verify and deploy

on:
  push:
    branches: [main, production, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d airate_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-ci.txt
            server/requirements.txt
      - run: pip install -r scripts/requirements-ci.txt
      - run: python -m pytest server -q --ignore=server/test_browser_addons.py --ignore=server/test_installed_data.py
        env:
          AIRATE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/airate_test
      - run: python -m pytest tests/test_telemetry.py -q
      - run: python -m pytest tests/test_brand_clarification.py -q
      - run: python -m pytest tests/test_xmlriver_text.py tests/test_rules.py tests/test_llm_parse.py -q
      - run: python -m pytest tests/test_delivery_workflow.py -q
      - run: bash -n deploy/release.sh deploy/ssh-gate.sh deploy/provision-ubuntu.sh deploy/setup-delivery.sh
      - name: Validate proxy configuration
        run: docker run --rm -e DOMAIN=airate.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run lint && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: airate-web-${{ github.sha }}
          path: web/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  image:
    name: Build server image
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_sha256: ${{ steps.archive.outputs.release_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Remove tracked website output
        run: git rm -r --ignore-unmatch web
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: airate-web-${{ github.sha }}
          path: web/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build tested server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: airate-web:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=airate-server
          cache-to: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/production' && 'type=gha,mode=max,scope=airate-server' || '' }}
      - name: Verify server image without desktop dependencies
        run: docker run --rm -e APP_ENV=test -e DATABASE_URL=sqlite:////tmp/account.db --entrypoint python airate-web:${{ github.sha }} -c 'from server.app import app; from server.cloud_scans import cloud_tick; assert app and cloud_tick'
      - name: Package production image
        id: archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/release.tar.gz"
          docker save "airate-web:$GITHUB_SHA" | gzip -1 > "$archive"
          printf 'release_sha256=%s\n' "$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload production image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: airate-release-${{ github.sha }}
          path: ${{ runner.temp }}/release.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  checks:
    name: Tests and build
    needs: [backend, frontend, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every delivery check
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ needs.backend.result }}' == success ]]
          [[ '${{ needs.frontend.result }}' == success ]]
          [[ '${{ needs.image.result }}' == success ]]

  deploy:
    name: Deploy production
    needs: [checks, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: airate-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: airate-release-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ needs.image.outputs.release_sha256 }}'
          [[ "$expected" =~ ^[[:xdigit:]]{64}$ ]]
          actual=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d ' ' -f 1)
          [[ "$actual" == "$expected" ]]
      - name: Upload and activate verified release
        env:
          DEPLOY_KEY: ${{ secrets.AIRATE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.AIRATE_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.AIRATE_DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Set AIRATE_DEPLOY_HOST in the production environment'; exit 64; }
          umask 077
          key="$RUNNER_TEMP/airate-deploy-key"
          hosts="$RUNNER_TEMP/airate-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          checksum=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d ' ' -f 1)
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8)
          ssh "${options[@]}" "airate-deploy@$DEPLOY_HOST" "upload $GITHUB_SHA $checksum" < "$RUNNER_TEMP/release.tar.gz"
          ssh "${options[@]}" "airate-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA $checksum"
      - name: Verify public release
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen('https://airate.tech/api/v1/ready', timeout=30) as response:
              data = json.load(response)
          assert data == {'ok': True, 'release': os.environ['EXPECTED_RELEASE']}, data
          with urllib.request.urlopen('https://airate.tech/api/v1/pricing', timeout=30) as response:
              pricing = json.load(response)
          assert pricing['check_price_kopeks'] == 120, pricing
          PY
