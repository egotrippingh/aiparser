name: Verify and deploy

on:
  push:
    branches: [main, production, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            scripts/requirements-ci.txt
            server/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r scripts/requirements-ci.txt
      - run: python -m pytest server -q
      - run: python -m pytest tests/test_telemetry.py -q
      - run: python -m pytest tests/test_brand_clarification.py -q
      - run: python -m pytest tests/test_updates.py tests/test_update_admission.py tests/test_agent_publication.py tests/test_desktop_login.py tests/test_profiles.py tests/test_login_feedback.py tests/test_data_paths.py tests/test_main_session_check.py tests/test_billing_recovery.py tests/test_agent_live_sync.py tests/test_perplexity_diagnostics.py tests/test_readable_capture.py tests/test_scan_plan.py -q
      - run: python -m pytest tests/test_service_timing.py tests/test_alice_wait.py tests/test_google_wait.py -q
      - run: python scripts/benchmark_scans.py --self-check
      - run: bash -n deploy/release.sh deploy/ssh-gate.sh deploy/provision-ubuntu.sh deploy/setup-delivery.sh
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  deploy:
    name: Deploy production
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    concurrency:
      group: airate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend from the tested commit
        run: npm ci && npm run build
        working-directory: frontend
      - name: Build release image
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "airate-web:$GITHUB_SHA" -f server/Dockerfile .
          docker save "airate-web:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/release.tar.gz"
      - name: Upload and activate verified release
        env:
          DEPLOY_KEY: ${{ secrets.AIRATE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.AIRATE_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.AIRATE_DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Set AIRATE_DEPLOY_HOST in the production environment'; exit 64; }
          umask 077
          key="$RUNNER_TEMP/airate-deploy-key"
          hosts="$RUNNER_TEMP/airate-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          checksum=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d ' ' -f 1)
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8)
          ssh "${options[@]}" "airate-deploy@$DEPLOY_HOST" "upload $GITHUB_SHA $checksum" < "$RUNNER_TEMP/release.tar.gz"
          ssh "${options[@]}" "airate-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA $checksum"
      - name: Verify public release
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen('https://airate.tech/api/v1/ready', timeout=30) as response:
              data = json.load(response)
          assert data == {'ok': True, 'release': os.environ['EXPECTED_RELEASE']}, data
          with urllib.request.urlopen('https://airate.tech/api/v1/pricing', timeout=30) as response:
              pricing = json.load(response)
          assert pricing['check_price_kopeks'] == 120, pricing
          PY
