<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Mentions Tracker</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="brand">
      <div class="mark">AI</div>
      <div><b>AI Mentions</b><span id="ver">portable</span></div>
    </div>

    <div class="projects" id="projectList">
      <div class="cap">Проекты</div>
    </div>

    <nav class="nav" id="mainNav">
      <button data-view="dashboard" class="on">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.8" y="1.8" width="5" height="5" rx="1"/><rect x="9.2" y="1.8" width="5" height="5" rx="1"/><rect x="1.8" y="9.2" width="5" height="5" rx="1"/><rect x="9.2" y="9.2" width="5" height="5" rx="1"/></svg>
        Дашборд
      </button>
      <button data-view="queries">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>
        Запросы <span class="tag" id="queryCount">0</span>
      </button>
      <button data-view="scan">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>
        Скан
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.6v1.8M8 12.6v1.8M14.4 8h-1.8M3.4 8H1.6M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3M12.5 12.5l-1.3-1.3M4.8 4.8L3.5 3.5"/></svg>
        Настройки
      </button>
    </nav>
  </aside>

  <div class="main">
    <header class="top" id="topBar"></header>
    <!-- Живёт вне #view намеренно: render() перерисовывает вкладку целиком,
         и прогресс, находясь внутри, пропадал бы при каждом переключении. -->
    <div class="globalscan" id="globalScan" hidden></div>
    <div class="scroll" id="view"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <div style="flex:1">
      <h3 id="dq">—</h3>
      <div class="s" id="dmeta"></div>
    </div>
    <button class="icobtn" id="closeDrawer">✕</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="toast-wrap" id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
